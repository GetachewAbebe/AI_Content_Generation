[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "heritage-short"
version = "0.1.0"
description = "Turn a validated storyboard.json into a narrated short film in two aspect ratios."
requires-python = ">=3.12"
dependencies = ["requests>=2.32", "jsonschema>=4.23", "Pillow>=11", "numpy>=2.1", "kaggle>=1.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy", "types-requests"]

[project.scripts]
heritage = "pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.setuptools.package-data]
"*" = ["*.py"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
ignore = ["E501"]  # the formatter wraps code; long strings and tables stay readable
select = ["E", "F", "W", "B", "I", "UP", "SIM", "C90", "RET", "ARG", "PLW"]

[tool.ruff.lint.per-file-ignores]
"pipeline/providers/fake.py" = ["ARG002"]  # fakes implement the full interface

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
exclude = ["pipeline/remote/.*_worker\\.py", "pipeline/remote/launch\\.py", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: renders video"]
